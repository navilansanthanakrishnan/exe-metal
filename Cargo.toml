[package]
name = "exe-metal"
version = "0.1.0"
edition = "2021"
# Set by egui/eframe, which are the floor for the `ui` feature. The CLI alone
# builds on older toolchains, but a single stated MSRV is less confusing than
# two, and CI enforces this one.
rust-version = "1.92"
description = "Run Windows games and applications on Apple Silicon macOS, using only free components"
license = "MIT"
readme = "README.md"
repository = "https://github.com/NavilanSanthanakrishnan/exe-metal"
homepage = "https://github.com/NavilanSanthanakrishnan/exe-metal"
documentation = "https://github.com/NavilanSanthanakrishnan/exe-metal#readme"
authors = ["Navilan Santhanakrishnan"]
keywords = ["wine", "macos", "directx", "metal", "gaming"]
categories = ["command-line-utilities", "emulators", "game-development"]
exclude = ["/.github", "/docs", "/bench", "/tests", "*.md", "!README.md"]

[[bin]]
name = "exe-metal"
path = "src/main.rs"

[features]
default = ["ui"]
# The window. Kept optional because it pulls a windowing and rendering stack
# that the CLI has no use for: `--no-default-features` still builds the full
# command-line tool in a couple of seconds.
ui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

eframe = { version = "0.35", optional = true }
egui = { version = "0.35", optional = true }
rfd = { version = "0.17", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true

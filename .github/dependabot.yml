version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The window pulls a large tree; reviewing it as one PR is far more
      # useful than reviewing forty.
      gui:
        patterns: ["eframe", "egui", "rfd", "winit", "wgpu*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
